apiVersion: apps/v1
kind: Deployment
metadata:
  name: studentai
  labels:
    app: studentai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: studentai
  template:
    metadata:
      labels:
        app: studentai
    spec:
      containers:
        - name: studentai
          image: arjun1254/studentai:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8501
          readinessProbe:
            httpGet:
              path: /
              port: 8501
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 8501
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
